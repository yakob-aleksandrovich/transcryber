# Alembic config for the developer command line only (e.g. creating a new
# migration). The app itself runs migrations at startup without this file.
# The database URL comes from config.yaml via app/db.py, not from here.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
